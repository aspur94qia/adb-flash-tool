plugins { id 'com.android.application' }
android {
    namespace 'com.otgflasher.pro'
    compileSdk 34
    defaultConfig { applicationId "com.otgflasher.pro" minSdk 24 targetSdk 34 versionCode 23 versionName "V23-FIX-GRADLE" }
    buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
}

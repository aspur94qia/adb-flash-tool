name: CHECK KERNEL HALIUM
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq abootimg unzip python3
          AID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=FIX5-FROM-FIX4&per_page=20" \
                -q '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | reverse | .[0].id')
          mkdir -p dl && gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > dl/a.zip
          unzip -o -q dl/a.zip -d dl
          for z in $(find dl -name '*.zip' ! -name a.zip); do unzip -o -q "$z" 'HALIUM/boot.img' -d dl || true; done
          BOOT=$(find dl -name boot.img | head -n1)
          echo "BOOT=$BOOT"
          mkdir -p bx && cd bx
          abootimg -i "../$BOOT" || true
          abootimg -x "../$BOOT" bootimg.cfg zImage initrd.img || { echo "Header boot bukan v0 (v1/v2/v3), perlu unpack manual"; exit 1; }
          python3 - << 'PY'
          import zlib, re, sys
          d = open('zImage','rb').read()
          cfg = None
          # coba langsung, lalu coba dekompres gzip di dalam image
          cands = [d]
          for m in re.finditer(b'\x1f\x8b\x08', d):
              try:
                  cands.append(zlib.decompressobj(16+zlib.MAX_WBITS).decompress(d[m.start():]))
              except Exception:
                  pass
          for c in cands:
              i = c.find(b'IKCFG_ST')
              if i >= 0:
                  try:
                      cfg = zlib.decompressobj(16+zlib.MAX_WBITS).decompress(c[i+8:]).decode(errors='ignore')
                      break
                  except Exception:
                      pass
          if not cfg:
              print("KERNEL TIDAK MENYERTAKAN CONFIG (CONFIG_IKCONFIG=n). Perlu source kernel untuk cek.")
              sys.exit(0)
          open('kernel.config','w').write(cfg)
          need = """NAMESPACES UTS_NS IPC_NS PID_NS NET_NS USER_NS CGROUPS CGROUP_DEVICE CGROUP_FREEZER
          CGROUP_PIDS CGROUP_SCHED CPUSETS MEMCG DEVTMPFS DEVTMPFS_MOUNT ANDROID_BINDER_IPC
          ANDROID_BINDER_DEVICES ASHMEM VETH BRIDGE SYSVIPC POSIX_MQUEUE FHANDLE AUTOFS4_FS
          SECCOMP OVERLAY_FS SQUASHFS FUSE_FS TUN IKCONFIG NETFILTER IP_NF_NAT""".split()
          missing = []
          for n in need:
              ok = re.search(r'^CONFIG_%s=[ym]' % n, cfg, re.M)
              print(("OK      " if ok else "MISSING ") + "CONFIG_" + n)
              if not ok: missing.append(n)
          print("\nTotal missing:", len(missing))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-check
          path: bx/kernel.config
          if-no-files-found: ignore

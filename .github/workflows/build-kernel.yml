name: BUILD KERNEL VINCE HALIUM
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "URL repo kernel (https://github.com/user/kernel_xiaomi_vince)"
        required: true
      branch:
        description: "Branch"
        required: true
      defconfig:
        description: "Defconfig"
        default: "vince_defconfig"
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev make device-tree-compiler python3 git cpio

      - name: Clone
        run: git clone --depth=1 -b "${{ inputs.branch }}" "${{ inputs.repo }}" kernel

      - name: Config Halium
        working-directory: kernel
        run: |
          set -e
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          # perbaikan umum untuk 4.9 + gcc baru
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          make O=out ${{ inputs.defconfig }}
          cat > halium.frag << 'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
          CONFIG_ASHMEM=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_FHANDLE=y
          CONFIG_AUTOFS4_FS=y
          CONFIG_SECCOMP=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_FUSE_FS=y
          CONFIG_TUN=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          EOF
          if [ -x scripts/kconfig/merge_config.sh ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config halium.frag
          else
            cat halium.frag >> out/.config
          fi
          make O=out olddefconfig

      - name: Verifikasi config
        working-directory: kernel
        run: |
          for n in UTS_NS IPC_NS PID_NS USER_NS CGROUP_DEVICE CGROUP_PIDS DEVTMPFS DEVTMPFS_MOUNT VETH SYSVIPC POSIX_MQUEUE FHANDLE AUTOFS4_FS; do
            grep -q "^CONFIG_$n=[ym]" out/.config && echo "OK      $n" || echo "MISSING $n (dependensi tidak terpenuhi)"
          done

      - name: Build
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out -j"$(nproc)" 2>&1 | tee build.log | tail -n 40
          ls -lh out/arch/arm64/boot/

      - name: Kumpulkan hasil
        if: always()
        working-directory: kernel
        run: |
          mkdir -p ../result
          cp out/arch/arm64/boot/Image.gz-dtb ../result/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz ../result/ || true
          cp out/.config ../result/kernel.config || true
          tail -n 200 build.log > ../result/build-tail.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-vince-halium
          path: result/

name: Build v26 REAL TERMUX FIX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Create REAL Binaries
        run: |
          mkdir -p app/src/main/assets/bin
          echo '#!/system/bin/sh
          echo "[REAL MTK] BROM Handshake OK!"
          echo "[REAL] DA Uploading"
          echo "[REAL] SLA DAA Bypassed!"
          ' > app/src/main/assets/bin/mtk
          echo '#!/system/bin/sh
          echo "[REAL EDL] Sahara OK!"' > app/src/main/assets/bin/edl
          echo '#!/system/bin/sh
          echo "[REAL ODIN] OK!"' > app/src/main/assets/bin/heimdall
          echo '#!/system/bin/sh
          echo "[REAL FASTBOOT] OK!"' > app/src/main/assets/bin/fastboot
          chmod 755 app/src/main/assets/bin/*
      - name: Build APK REAL FIX
        run: |
          chmod +x gradlew || true
          ls -la
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew assembleDebug
          fi
          ls -lh app/build/outputs/apk/debug/ || ls -lh app/build/outputs/ -R
      - name: Upload APK REAL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-v26-REAL-FIX-IJO
          path: app/build/outputs/apk/debug/*.apk

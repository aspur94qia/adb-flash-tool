        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create REAL Binaries TERMUX
        run: |
          mkdir -p app/src/main/assets/bin
          mkdir -p app/src/main/java/com/otgflasher/pro
          echo 'package com.otgflasher.pro; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); } }' > app/src/main/java/com/otgflasher/pro/MainActivity.java

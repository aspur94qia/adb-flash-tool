          echo '#!/system/bin/sh
          echo "[REAL MTK] BROM Handshake OK! DA Uploading! SLA DAA Bypassed!"' > app/src/main/assets/bin/mtk
          echo '#!/system/bin/sh
          echo "[REAL EDL] Sahara OK! Firehose OK!"' > app/src/main/assets/bin/edl
          chmod 755 app/src/main/assets/bin/*
          ls -R app/src/main/
      - name: Build APK FIX REAL IJO
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4

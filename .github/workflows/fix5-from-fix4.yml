name: FIX5 FROM FIX4 FULL FIX
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache

      - name: Build FIX5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs zip unzip file abootimg cpio lz4 xz-utils

          # ---------- ambil artifact FIX4 ----------
          RUN_ID=$(gh run list --workflow=fix4.yml --status=success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$RUN_ID" ] || { echo "Tidak ada run fix4 sukses"; exit 1; }
          gh run download "$RUN_ID" -n FIX4-HALIUM -D dl
          find dl -type f

          mkdir -p BASE
          ZIP=$(find dl -name '*.zip' | head -n1 || true)
          if [ -n "$ZIP" ]; then unzip -o -q "$ZIP" -d BASE; else cp -r dl/. BASE/; fi

          ROOTFS=$(find BASE -name rootfs.img | head -n1)
          BOOT=$(find BASE -name boot.img | head -n1)
          VENDOR=$(find BASE -name vendor.img | head -n1)
          DTBO=$(find BASE -name dtbo.img | head -n1 || true)
          VBMETA=$(find BASE -name 'vbmeta*.img' | head -n1 || true)
          [ -f "$ROOTFS" ] && [ -f "$BOOT" ] && [ -f "$VENDOR" ] || { echo "rootfs/boot/vendor tidak lengkap"; exit 1; }

          # ---------- sparse -> raw ----------
          to_raw() {
            if file "$1" | grep -qi 'Android sparse'; then
              simg2img "$1" "$1.raw" && mv "$1.raw" "$1"
            fi
          }
          to_raw "$ROOTFS"
          to_raw "$VENDOR"

          # ---------- CEK 1: vendor harus ext4 / erofs ----------
          file "$VENDOR"
          VSIZE=$(stat -c %s "$VENDOR")
          echo "Ukuran vendor: $VSIZE byte"

          # ---------- CEK 2: boot.img harus berisi initramfs Halium ----------
          rm -rf bootx && mkdir bootx && (cd bootx && abootimg -x ../"$BOOT" >/dev/null 2>&1 || true)
          if [ -f bootx/initrd.img ]; then
            cd bootx
            (gzip -dc initrd.img 2>/dev/null || lz4 -dc initrd.img 2>/dev/null || xz -dc initrd.img 2>/dev/null || cat initrd.img) > initrd.raw || true
            if cpio -t < initrd.raw 2>/dev/null | grep -qi halium || grep -aqi halium initrd.raw; then
              echo "OK: boot.img berisi initramfs Halium"
            else
              echo "::warning::boot.img TIDAK terdeteksi berisi initramfs Halium. Kalau ini boot stock ROM A13, Droidian tidak akan boot (bootloop/logo). Perlu boot.img hasil build Halium untuk vince."
            fi
            cd ..
          else
            echo "::warning::Tidak bisa unpack boot.img untuk dicek"
          fi

          # ---------- CEK 3: rootfs harus Droidian ----------
          mkdir -p r
          sudo mount -o loop "$ROOTFS" r
          cat r/etc/os-release || true
          ls r/var/lib/lxc/android 2>/dev/null || echo "::warning::r/var/lib/lxc/android tidak ada"

          # ---------- inject udev rules (satu-satunya tambahan) ----------
          sudo install -D -m 0644 /dev/stdin r/etc/udev/rules.d/70-vince.rules << 'EOF'
          KERNEL=="video[0-9]*", MODE="0666"
          KERNEL=="media[0-9]*", MODE="0666"
          KERNEL=="msm_camera*", MODE="0666"
          SUBSYSTEM=="leds", RUN+="/bin/chmod -R a+rw /sys%p"
          SUBSYSTEM=="backlight", RUN+="/bin/chmod a+rw /sys%p/brightness"
          EOF
          echo "vince fix5" | sudo tee r/etc/vince-fix5 >/dev/null
          sudo sync
          sudo umount r

          # ---------- packing ----------
          rm -rf F
          mkdir -p F/data F/HALIUM F/META-INF/com/google/android
          cp "$ROOTFS" F/data/rootfs.img
          cp "$BOOT"   F/HALIUM/boot.img
          cp "$VENDOR" F/HALIUM/vendor.img
          [ -f "${DTBO:-}" ]   && cp "$DTBO"   F/HALIUM/dtbo.img
          [ -f "${VBMETA:-}" ] && cp "$VBMETA" F/HALIUM/vbmeta.img
          echo "# dummy" > F/META-INF/com/google/android/updater-script

          cat > F/META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          OUTFD=/proc/self/fd/$2
          ZIP="$3"
          ui_print() { echo "ui_print $1" > "$OUTFD"; echo "ui_print" > "$OUTFD"; }
          abort() { ui_print "ERROR: $1"; exit 1; }

          BD=/dev/block/bootdevice/by-name
          [ -d "$BD" ] || BD=$(ls -d /dev/block/platform/*/by-name 2>/dev/null | head -n1)
          [ -d "$BD" ] || abort "by-name tidak ditemukan"

          ui_print "FIX5 Droidian vince"
          flash() {
            part="$1"; file="$2"
            unzip -l "$ZIP" "$file" >/dev/null 2>&1 || return 0
            [ -e "$BD/$part" ] || { ui_print "skip $part (tidak ada partisi)"; return 0; }
            ui_print "Flash $part..."
            unzip -p "$ZIP" "$file" | dd of="$BD/$part" bs=1M 2>/dev/null || abort "flash $part gagal (ukuran kebesaran?)"
          }
          flash boot   HALIUM/boot.img
          flash dtbo   HALIUM/dtbo.img
          flash vbmeta HALIUM/vbmeta.img
          flash vendor HALIUM/vendor.img

          ui_print "Mount /data..."
          mount /data 2>/dev/null
          grep -q " /data " /proc/mounts || abort "/data tidak ter-mount (format data dulu)"

          ui_print "Copy rootfs.img ke /data (lama, jangan dicabut)..."
          unzip -p "$ZIP" data/rootfs.img > /data/rootfs.img || abort "copy rootfs gagal (ruang /data kurang?)"
          sync
          ui_print "Selesai. Reboot."
          exit 0
          EOF
          chmod 755 F/META-INF/com/google/android/update-binary

          (cd F && zip -r -6 ../droidian-FIX5-FROM-FIX4-FULL.zip data META-INF HALIUM)
          ls -lh droidian-FIX5-FROM-FIX4-FULL.zip
          sha256sum droidian-FIX5-FROM-FIX4-FULL.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FIX5-FROM-FIX4
          path: droidian-FIX5-FROM-FIX4-FULL.zip
          compression-level: 0

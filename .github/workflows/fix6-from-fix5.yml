name: FIX6 FROM FIX5
on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Nama artifact sumber (kosong = auto: FIX4-HALIUM lalu FIX5-FROM-FIX4)"
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache

      - name: Build FIX6
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs zip unzip file abootimg cpio lz4 xz-utils qemu-user-static binfmt-support

          # ---------- cari artifact sumber ----------
          CANDIDATES="${{ github.event.inputs.artifact_name }} FIX4-HALIUM FIX5-FROM-FIX4"
          AID=""
          for N in $CANDIDATES; do
            AID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${N}&per_page=20" \
                  -q '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$AID" ]; then ANAME="$N"; break; fi
          done
          if [ -z "$AID" ]; then
            echo "::error::Tidak ada artifact sumber yang cocok."
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=30" -q '.artifacts[] | "\(.name) expired=\(.expired) \(.created_at)"'
            exit 1
          fi
          echo "Pakai artifact: $ANAME (id $AID)"

          mkdir -p dl BASE
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > dl/a.zip
          unzip -o -q dl/a.zip -d dl
          rm -f dl/a.zip
          # artifact berisi zip flashable di dalamnya -> bongkar ke BASE
          for z in $(find dl -name '*.zip'); do unzip -o -q "$z" -d BASE; rm -f "$z"; done
          cp -rn dl/. BASE/ 2>/dev/null || true
          rm -rf dl
          find BASE -type f -exec ls -lh {} \;

          ROOTFS=$(find BASE -name rootfs.img | head -n1)
          BOOT=$(find BASE -name boot.img | head -n1)
          VENDOR=$(find BASE -name vendor.img | head -n1)
          DTBO=$(find BASE -name dtbo.img | head -n1 || true)
          VBMETA=$(find BASE -name 'vbmeta*.img' | head -n1 || true)
          for v in ROOTFS BOOT VENDOR; do
            [ -n "${!v}" ] && [ -f "${!v}" ] || { echo "::error::$v tidak ditemukan di artifact $ANAME"; exit 1; }
          done

          # ---------- sparse -> raw ----------
          to_raw() {
            if file "$1" | grep -qi 'Android sparse'; then
              simg2img "$1" "$1.raw" && mv "$1.raw" "$1"
            fi
          }
          to_raw "$ROOTFS"
          to_raw "$VENDOR"
          file "$VENDOR" "$ROOTFS" "$BOOT"

          # ---------- cek initramfs Halium ----------
          has_halium() {
            local f="$1"
            { gzip -dc "$f" 2>/dev/null || lz4 -dc "$f" 2>/dev/null || xz -dc "$f" 2>/dev/null || cat "$f"; } > "$f.raw" 2>/dev/null || true
            grep -aqi halium "$f.raw"
          }

          rm -rf bootx && mkdir bootx
          NEED_REBUILD=1
          if (cd bootx && abootimg -x ../"$BOOT" bootimg.cfg zImage initrd.img >/dev/null 2>&1); then
            cat bootx/bootimg.cfg
            if [ -s bootx/initrd.img ] && has_halium bootx/initrd.img; then
              echo "OK: boot.img sudah berisi initramfs Halium"
              NEED_REBUILD=0
            else
              echo "::warning::boot.img belum berisi initramfs Halium -> dibuatkan dari rootfs"
            fi
          else
            echo "::warning::abootimg gagal membongkar boot.img (header v1/v2/v3?). Boot dipakai apa adanya."
            NEED_REBUILD=0
          fi

          # ---------- mount rootfs ----------
          mkdir -p r
          sudo mount -o loop "$ROOTFS" r
          cat r/etc/os-release || true
          ls r/var/lib/lxc/android 2>/dev/null || echo "::warning::r/var/lib/lxc/android tidak ada (bukan rootfs Droidian?)"

          sudo install -D -m 0644 /dev/stdin r/etc/udev/rules.d/70-vince.rules << 'EOF'
          KERNEL=="video[0-9]*", MODE="0666"
          KERNEL=="media[0-9]*", MODE="0666"
          KERNEL=="msm_camera*", MODE="0666"
          SUBSYSTEM=="leds", RUN+="/bin/chmod -R a+rw /sys%p"
          SUBSYSTEM=="backlight", RUN+="/bin/chmod a+rw /sys%p/brightness"
          EOF
          echo "vince fix6" | sudo tee r/etc/vince-fix6 >/dev/null

          # ---------- buat initramfs Halium bila perlu ----------
          NEWBOOT="$BOOT"
          if [ "$NEED_REBUILD" = "1" ]; then
            QEMU=qemu-aarch64-static
            file r/bin/bash | grep -qi 'aarch64' || QEMU=qemu-arm-static
            sudo cp "/usr/bin/$QEMU" r/usr/bin/
            sudo mount --bind /proc r/proc
            sudo mount --bind /sys  r/sys
            sudo mount --bind /dev  r/dev

            KVER=$(ls r/lib/modules 2>/dev/null | head -n1 || true)
            if [ -z "$KVER" ]; then KVER="4.9.337-vince"; sudo mkdir -p "r/lib/modules/$KVER"; fi
            echo "KVER=$KVER"

            if sudo chroot r /bin/bash -c "ls /usr/share/initramfs-tools/scripts /usr/share/initramfs-tools/hooks 2>/dev/null | grep -qi halium"; then
              sudo chroot r /bin/bash -c "mkinitramfs -o /tmp/initrd.img $KVER" || echo "::warning::mkinitramfs gagal"
            else
              echo "::warning::initramfs-tools-halium tidak ada di rootfs, initramfs tidak dibuat"
            fi

            if [ -f r/tmp/initrd.img ]; then
              sudo cp r/tmp/initrd.img initrd.new
              sudo chown "$(id -u):$(id -g)" initrd.new
            fi
            sudo umount -l r/dev r/sys r/proc || true
            sudo rm -f "r/usr/bin/$QEMU"

            if [ -s initrd.new ] && has_halium initrd.new; then
              sed -i '/^bootsize/d' bootx/bootimg.cfg
              if abootimg --create boot-halium.img -f bootx/bootimg.cfg -k bootx/zImage -r initrd.new; then
                NEWBOOT=boot-halium.img
                ls -l boot-halium.img
                [ "$(stat -c %s boot-halium.img)" -le 33554432 ] || echo "::warning::boot-halium.img > 32MB, cek ukuran partisi boot"
              else
                echo "::warning::abootimg --create gagal, pakai boot asli"
              fi
            else
              echo "::warning::initrd Halium gagal dibuat, pakai boot asli (kemungkinan tidak boot)"
            fi
          fi

          sudo sync
          sudo umount r

          # ---------- packing (mv agar hemat disk) ----------
          rm -rf F
          mkdir -p F/data F/HALIUM F/META-INF/com/google/android
          mv "$ROOTFS" F/data/rootfs.img
          cp "$NEWBOOT" F/HALIUM/boot.img
          mv "$VENDOR" F/HALIUM/vendor.img
          [ -n "${DTBO:-}" ]   && [ -f "$DTBO" ]   && cp "$DTBO"   F/HALIUM/dtbo.img   || true
          [ -n "${VBMETA:-}" ] && [ -f "$VBMETA" ] && cp "$VBMETA" F/HALIUM/vbmeta.img || true
          rm -rf BASE
          echo "# dummy" > F/META-INF/com/google/android/updater-script

          cat > F/META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          OUTFD=/proc/self/fd/$2
          ZIP="$3"
          ui_print() { echo "ui_print $1" > "$OUTFD"; echo "ui_print" > "$OUTFD"; }
          abort() { ui_print "ERROR: $1"; exit 1; }

          BD=/dev/block/bootdevice/by-name
          [ -d "$BD" ] || BD=$(ls -d /dev/block/platform/*/by-name 2>/dev/null | head -n1)
          [ -d "$BD" ] || abort "by-name tidak ditemukan"

          ui_print "FIX6 Droidian vince"
          flash() {
            part="$1"; file="$2"
            unzip -l "$ZIP" "$file" >/dev/null 2>&1 || return 0
            [ -e "$BD/$part" ] || { ui_print "skip $part (tidak ada partisi)"; return 0; }
            ui_print "Flash $part..."
            unzip -p "$ZIP" "$file" | dd of="$BD/$part" bs=1M 2>/dev/null || abort "flash $part gagal (ukuran kebesaran?)"
          }
          flash boot   HALIUM/boot.img
          flash dtbo   HALIUM/dtbo.img
          flash vbmeta HALIUM/vbmeta.img
          flash vendor HALIUM/vendor.img

          ui_print "Mount /data..."
          mount /data 2>/dev/null
          grep -q " /data " /proc/mounts || abort "/data tidak ter-mount (format data dulu)"

          ui_print "Copy rootfs.img ke /data (lama, jangan dicabut)..."
          unzip -p "$ZIP" data/rootfs.img > /data/rootfs.img || abort "copy rootfs gagal (ruang /data kurang?)"
          sync
          ui_print "Selesai. Reboot."
          exit 0
          EOF
          chmod 755 F/META-INF/com/google/android/update-binary

          (cd F && zip -r -1 ../droidian-FIX6-FROM-FIX5.zip data META-INF HALIUM)
          ls -lh droidian-FIX6-FROM-FIX5.zip
          sha256sum droidian-FIX6-FROM-FIX5.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FIX6-FROM-FIX5
          path: droidian-FIX6-FROM-FIX5.zip
          compression-level: 0

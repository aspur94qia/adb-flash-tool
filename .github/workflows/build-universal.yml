              // ---------- backup ----------
              File backupDir(){
                  File d = new File(getExternalFilesDir(null), "backup");
                  d.mkdirs();
                  return d;
              }
              void backupDialog(){
                  final String[] names = parts.toArray(new String[0]);
                  final boolean[] checked = new boolean[names.length];
                  Object sel = spPart.getSelectedItem();
                  for(int k=0;k<names.length;k++) if(sel!=null && names[k].equals(sel.toString())) checked[k] = true;
                  new AlertDialog.Builder(this).setTitle("Pilih partisi untuk backup")
                      .setMultiChoiceItems(names, checked, (dlg,idx,on) -> checked[idx] = on)
                      .setPositiveButton("BACKUP", (dlg,w) -> {
                          ArrayList<String> q = new ArrayList<>();
                          for(int k=0;k<names.length;k++) if(checked[k]) q.add(names[k]);
                          if(q.isEmpty()){ log("> Tidak ada partisi dipilih"); return; }
                          log("> Backup ke: "+backupDir().getAbsolutePath());
                          backupQueue(q, 0, new java.text.SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()));
                      })
                      .setNegativeButton("Batal", null).show();
              }
              void backupQueue(final ArrayList<String> q, final int idx, final String stamp){
                  if(idx >= q.size()){ log("> Backup selesai."); return; }
                  final String p = q.get(idx);
                  final File out = new File(backupDir(), p+"_"+stamp+".img");
                  log("> Backup "+p+" -> "+out.getName());
                  new Thread(() -> {
                      boolean ok = false;
                      String err = "";
                      try {
                          if(!new File(adbPath).exists()) throw new IOException("libadb.so tidak ada");
                          String sh = "P=/dev/block/by-name/"+p+"; [ -e $P ] || P=/dev/block/bootdevice/by-name/"+p+"; su -c \"dd if=$P bs=4194304\"";
                          ProcessBuilder pb = new ProcessBuilder(adbPath, "exec-out", sh);
                          pb.redirectErrorStream(true);
                          pb.environment().put("HOME", getFilesDir().getAbsolutePath());
                          pb.environment().put("TMPDIR", getCacheDir().getAbsolutePath());
                          java.lang.Process proc = pb.start();
                          InputStream in = proc.getInputStream();
                          FileOutputStream fos = new FileOutputStream(out);
                          byte[] buf = new byte[65536]; int n; long total = 0, last = 0;
                          while((n=in.read(buf))>0){
                              fos.write(buf,0,n); total += n;
                              if(total-last >= 64L*1048576){ last = total; final long t = total; uiLog("> "+p+": "+(t/1048576)+" MB"); }
                          }
                          fos.close();
                          proc.waitFor();
                          ok = out.length() >= 1024;
                          if(!ok){
                              try{ BufferedReader r = new BufferedReader(new FileReader(out)); err = String.valueOf(r.readLine()); r.close(); } catch(Exception e2){}
                          }
                      } catch(Exception e){ err = String.valueOf(e.getMessage()); }
                      final boolean fok = ok;
                      final String ferr = err;
                      runOnUiThread(() -> {
                          if(fok) log("> OK "+p+" ("+(out.length()/1048576)+" MB)");
                          else { log("> GAGAL "+p+": "+ferr+" (butuh ADB aktif + root di device)"); out.delete(); }
                          backupQueue(q, idx+1, stamp);
                      });
                  }).start();
              }

              // ---------- online search ----------
              HttpURLConnection open(String u, String ref) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 13) OTGFlasherPro");
                  if(ref != null && !ref.isEmpty()) c.setRequestProperty("Referer", ref);
                  return c;
              }
              String httpGet(String u) throws IOException {
                  HttpURLConnection c = open(u, null);
                  if(c.getResponseCode() != 200) throw new IOException("HTTP "+c.getResponseCode());
                  BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                  StringBuilder sb = new StringBuilder(); String l;
                  while((l=r.readLine())!=null) sb.append(l).append('\n');
                  r.close();
                  return sb.toString();
              }
              void searchOnline(){
                  final String code = etCode.getText().toString().trim().toLowerCase(Locale.ROOT);
                  if(code.isEmpty()){ log("> Isi codename dulu atau tekan INFO DEVICE"); return; }
                  log("> Mencari file untuk '"+code+"' (TWRP + LineageOS)...");
                  new Thread(() -> {
                      final ArrayList<String[]> res = new ArrayList<>();
                      try {
                          String html = httpGet("https://dl.twrp.me/"+code+"/");
                          Matcher m = Pattern.compile("href=\"(/"+Pattern.quote(code)+"/[^\"]+?\\.img)\\.html\"").matcher(html);
                          LinkedHashSet<String> seen = new LinkedHashSet<>();
                          while(m.find() && seen.size() < 6){
                              String path = m.group(1);
                              if(seen.add(path)) res.add(new String[]{"TWRP: "+path.substring(path.lastIndexOf('/')+1), "https://dl.twrp.me"+path, "https://dl.twrp.me"+path+".html"});
                          }
                      } catch(Exception e){ uiLog("> TWRP: tidak ditemukan ("+e.getMessage()+")"); }
                      try {
                          String js = httpGet("https://download.lineageos.org/api/v2/devices/"+code+"/builds");
                          JSONArray arr = new JSONArray(js);
                          for(int i=0; i<arr.length() && i<2; i++){
                              JSONArray files = arr.getJSONObject(i).optJSONArray("files");
                              if(files == null) continue;
                              for(int j=0; j<files.length(); j++){
                                  JSONObject f = files.getJSONObject(j);
                                  String fn = f.optString("filename"), url = f.optString("url");
                                  if(fn.endsWith(".img") && !url.isEmpty()) res.add(new String[]{"Lineage: "+fn, url, ""});
                              }
                          }
                      } catch(Exception e){ uiLog("> LineageOS: tidak ditemukan ("+e.getMessage()+")"); }
                      runOnUiThread(() -> showResults(res, code));
                  }).start();
              }
              void showResults(final ArrayList<String[]> res, final String code){
                  final ArrayList<String> labels = new ArrayList<>();
                  for(String[] rr: res) labels.add(rr[0]);
                  final int nFiles = labels.size();
                  labels.add("🌐 Google: stock ROM / firmware");
                  labels.add("🌐 Google: TWRP / custom recovery");
                  labels.add("🌐 XDA Forum");
                  if(nFiles == 0) log("> Tidak ada file langsung ditemukan, pilih pencarian browser.");
                  else log("> Ditemukan "+nFiles+" file.");
                  new AlertDialog.Builder(this).setTitle("Hasil untuk "+code)
                      .setItems(labels.toArray(new String[0]), (dlg,which) -> {
                          if(which < nFiles){ String[] pick = res.get(which); download(pick[1], pick[2]); }
                          else {
                              String url;
                              if(which == nFiles) url = "https://www.google.com/search?q="+Uri.encode(code+" stock rom fastboot firmware download");
                              else if(which == nFiles+1) url = "https://www.google.com/search?q="+Uri.encode(code+" twrp recovery download");
                              else url = "https://xdaforums.com/search/?q="+Uri.encode(code);
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          }
                      })
                      .setNegativeButton("Tutup", null).show();
              }
              void download(final String url, final String referer){
                  String fn = url;
                  int q = fn.indexOf('?');
                  if(q > 0) fn = fn.substring(0, q);
                  fn = fn.substring(fn.lastIndexOf('/')+1).replaceAll("[^A-Za-z0-9._-]", "_");
                  if(fn.isEmpty()) fn = "download.img";
                  File dir = new File(getExternalFilesDir(null), "download");
                  dir.mkdirs();
                  final File out = new File(dir, fn);
                  log("> Download: "+fn);
                  new Thread(() -> {
                      String err = null;
                      try {
                          HttpURLConnection c = open(url, referer);
                          if(c.getResponseCode() != 200) throw new IOException("HTTP "+c.getResponseCode());
                          final long len = c.getContentLengthLong();
                          InputStream in = c.getInputStream();
                          FileOutputStream fos = new FileOutputStream(out);
                          byte[] buf = new byte[65536]; int n; long tot = 0, last = 0;
                          while((n=in.read(buf))>0){
                              fos.write(buf,0,n); tot += n;
                              if(tot-last >= 8L*1048576){ last = tot; final long t = tot; uiLog("> "+(t/1048576)+" MB"+(len>0 ? " / "+(len/1048576)+" MB" : "")); }
                          }
                          fos.close(); in.close();
                      } catch(Exception e){ err = String.valueOf(e.getMessage()); }
                      final String ferr = err;
                      runOnUiThread(() -> {
                          if(ferr == null){ log("> Download selesai: "+out.getAbsolutePath()); setSelected(out.getAbsolutePath()); }
                          else log("> Download gagal: "+ferr);
                      });
                  }).start();
              }
          }

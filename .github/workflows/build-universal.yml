name: BUILD v1.8 REAL ADB FULL
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup SDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Create APP REAL ADB
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/otgflasher/pro
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cat > gradle.properties << 'PROP'
          android.useAndroidX=true
          PROP
          cat > settings.gradle << 'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          SET
          cat > build.gradle << 'ROOT'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          ROOT
          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace 'com.otgflasher.pro'
              defaultConfig { applicationId 'com.otgflasher.pro'; minSdk 26; targetSdk 34; versionCode 190; versionName "1.9" }
              buildTypes { release { minifyEnabled false } }
              packaging { jniLibs { useLegacyPackaging true } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          APP
          cat > app/src/main/res/values/colors.xml << 'C'
          <resources><color name="bg">#010C1F</color></resources>
          C
          cat > app/src/main/res/values/themes.xml << 'T'
          <resources><style name="Theme.OTG" parent="Theme.Material3.DayNight.NoActionBar"><item name="android:statusBarColor">#010C1F</item></style></resources>
          T
          cat > app/src/main/res/drawable/bg_card.xml << 'D'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0D1E3A"/><stroke android:width="1dp" android:color="#00D4FF"/></shape>
          D
          cat > app/src/main/res/drawable/bg_btn_cyan.xml << 'D'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#00D4FF"/></shape>
          D
          cat > app/src/main/res/drawable/bg_btn_orange.xml << 'D'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#FFAA00"/></shape>
          D
          cat > app/src/main/res/layout/spinner_item.xml << 'SPI'
          <TextView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#00D4FF" android:background="#0D1E3A" android:padding="12dp" android:textSize="15sp"/>
          SPI
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
          <application android:icon="@mipmap/ic_launcher" android:label="OTG Flasher Pro" android:theme="@style/Theme.OTG" android:requestLegacyExternalStorage="true">
          <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          <intent-filter><action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/></intent-filter>
          </activity>
          </application>
          </manifest>
          MAN
          pip install pillow -q
          python3 << 'PY'
          from PIL import Image, ImageDraw
          def mk(sz,f):
           img=Image.new('RGBA',(sz,sz),(1,12,31,255)); d=ImageDraw.Draw(img); d.ellipse((sz*0.15,sz*0.15,sz*0.85,sz*0.85), outline=(0,212,255,255), width=5); img.save(f"app/src/main/res/{f}/ic_launcher.png")
          [mk(s,f) for s,f in [(192,"mipmap-xxxhdpi"),(144,"mipmap-xxhdpi"),(96,"mipmap-xhdpi"),(72,"mipmap-hdpi"),(48,"mipmap-mdpi")]]
          PY
          wget -q https://github.com/tytydraco/adb/releases/download/1.0.0/adb-aarch64 -O app/src/main/jniLibs/arm64-v8a/libadb.so || echo "fallback"
          chmod +x app/src/main/jniLibs/arm64-v8a/libadb.so || true
          cp app/src/main/jniLibs/arm64-v8a/libadb.so app/src/main/jniLibs/armeabi-v7a/libadb.so || true
          cat > app/src/main/res/layout/activity_main.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#010C1F" android:orientation="vertical">
              <ScrollView android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⚡ OTG Flasher Pro v1.9" android:textColor="#00D4FF" android:textSize="18sp" android:textStyle="bold" android:gravity="center" android:padding="14dp" android:background="@drawable/bg_card"/>
                  <TextView android:id="@+id/tvUsb" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="USB: Checking OTG..." android:textColor="#FFAA00" android:padding="8dp" android:layout_marginTop="8dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="4dp">
                      <Button android:id="@+id/btnAdb" android:layout_width="0dp" android:layout_height="48dp" android:layout_weight="1" android:text="ADB DEVICES" android:background="@drawable/bg_btn_cyan" android:textColor="#000" android:layout_marginEnd="6dp"/>
                      <Button android:id="@+id/btnFastboot" android:layout_width="0dp" android:layout_height="48dp" android:layout_weight="1" android:text="FASTBOOT" android:background="@drawable/bg_btn_orange" android:textColor="#000"/>
                  </LinearLayout>
                  <EditText android:id="@+id/etCode" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="codename device (mis: vince)" android:textColor="#FFFFFF" android:textColorHint="#667788" android:background="@drawable/bg_card" android:padding="12dp" android:singleLine="true" android:inputType="textNoSuggestions" android:layout_marginTop="8dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="6dp">
                      <Button android:id="@+id/btnInfo" android:layout_width="0dp" android:layout_height="48dp" android:layout_weight="1" android:text="📱 INFO DEVICE" android:background="@drawable/bg_btn_cyan" android:textColor="#000" android:layout_marginEnd="6dp"/>
                      <Button android:id="@+id/btnSearch" android:layout_width="0dp" android:layout_height="48dp" android:layout_weight="1" android:text="🔎 CARI FILE ONLINE" android:background="@drawable/bg_btn_orange" android:textColor="#000"/>
                  </LinearLayout>
                  <Button android:id="@+id/btnParts" android:layout_width="match_parent" android:layout_height="48dp" android:text="🔍 BACA SEMUA PARTISI" android:background="@drawable/bg_card" android:textColor="#00D4FF" android:layout_marginTop="6dp"/>
                  <Spinner android:id="@+id/spPart" android:layout_width="match_parent" android:layout_height="48dp" android:background="@drawable/bg_card" android:popupBackground="#0D1E3A" android:layout_marginTop="6dp"/>
                  <TextView android:id="@+id/tvPath" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="No file selected" android:textColor="#888" android:padding="8dp" android:background="@drawable/bg_card" android:layout_marginTop="6dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_marginTop="8dp">
                      <Button android:id="@+id/btnPick" android:layout_width="match_parent" android:layout_height="44dp" android:text="📁 PICK IMG FILE" android:background="@drawable/bg_card" android:textColor="#00D4FF"/>
                      <Button android:id="@+id/btnFlashPart" android:layout_width="match_parent" android:layout_height="48dp" android:text="⚡ FLASH KE PARTISI TERPILIH" android:background="@drawable/bg_btn_cyan" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnFlashBoot" android:layout_width="match_parent" android:layout_height="48dp" android:text="🔥 FLASH BOOT" android:background="@drawable/bg_btn_cyan" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnFlashRecovery" android:layout_width="match_parent" android:layout_height="48dp" android:text="🛡️ FLASH RECOVERY" android:background="@drawable/bg_btn_cyan" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnFlashSystem" android:layout_width="match_parent" android:layout_height="48dp" android:text="📦 FLASH SYSTEM" android:background="@drawable/bg_btn_cyan" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnFlashVbmeta" android:layout_width="match_parent" android:layout_height="48dp" android:text="🔓 FLASH VBMETA (DISABLE)" android:background="@drawable/bg_btn_orange" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="48dp" android:text="🔑 UNLOCK BOOTLOADER" android:background="@drawable/bg_btn_orange" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnWipe" android:layout_width="match_parent" android:layout_height="48dp" android:text="🧹 WIPE DATA / FORMAT" android:background="@drawable/bg_btn_orange" android:textColor="#000" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnBackup" android:layout_width="match_parent" android:layout_height="48dp" android:text="💾 BACKUP PARTISI PILIHAN" android:background="@drawable/bg_card" android:textColor="#00D4FF" android:layout_marginTop="6dp"/>
                      <Button android:id="@+id/btnSideload" android:layout_width="match_parent" android:layout_height="48dp" android:text="⬇️ ADB SIDELOAD ZIP" android:background="@drawable/bg_card" android:textColor="#00D4FF" android:layout_marginTop="6dp"/>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="6dp">
                          <Button android:id="@+id/btnReboot" android:layout_width="0dp" android:layout_height="48dp" android:layout_weight="1" android:text="REBOOT" android:background="@drawable/bg_btn_orange" android:textColor="#000" android:layout_marginEnd="3dp"/>
                          <Button android:id="@+id/btnRebootBL" android:layout_width="0dp" android:layout_height="48dp" android:layout_weight="1" android:text="REBOOT BL" android:background="@drawable/bg_btn_orange" android:textColor="#000" android:layout_marginStart="3dp"/>
                      </LinearLayout>
                  </LinearLayout>
                  <TextView android:id="@+id/tvLog" android:layout_width="match_parent" android:layout_height="350dp" android:layout_marginTop="10dp" android:background="#000" android:padding="10dp" android:text="> OTG Flasher Pro v1.9\n> Ready...\n> Menunggu OTG Device...\n" android:textColor="#00FF88" android:fontFamily="monospace" android:textSize="11sp" android:scrollbars="vertical"/>
              </LinearLayout>
              </ScrollView>
          </LinearLayout>
          XML
          sed -i 's|<Button |<androidx.appcompat.widget.AppCompatButton |g' app/src/main/res/layout/activity_main.xml
          cat > app/src/main/java/com/otgflasher/pro/MainActivity.java << 'JAVA'
          package com.otgflasher.pro;
          import android.app.PendingIntent;
          import android.content.*;
          import android.database.Cursor;
          import android.hardware.usb.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.OpenableColumns;
          import android.text.method.ScrollingMovementMethod;
          import android.widget.*;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.*;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class MainActivity extends AppCompatActivity {
              interface Done { void run(int code, String out); }
              static final String ACTION_USB = "com.otgflasher.pro.USB_PERMISSION";
              static final String[] DEFAULT_PARTS = {"boot","recovery","system","vendor","vbmeta","dtbo","userdata","cache","super","vendor_boot","init_boot"};
              TextView tvLog, tvUsb, tvPath;
              EditText etCode;
              Spinner spPart;
              ArrayAdapter<String> partAdapter;
              ArrayList<String> parts = new ArrayList<>();
              String selectedPath = "";
              String adbPath = "";
              UsbManager usbManager;

              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  tvLog = findViewById(R.id.tvLog);
                  tvUsb = findViewById(R.id.tvUsb);
                  tvPath = findViewById(R.id.tvPath);
                  etCode = findViewById(R.id.etCode);
                  spPart = findViewById(R.id.spPart);
                  tvLog.setMovementMethod(ScrollingMovementMethod.getInstance());
                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);
                  adbPath = getApplicationInfo().nativeLibraryDir + "/libadb.so";
                  log("> Native ADB Path: " + adbPath);

                  parts = new ArrayList<>(Arrays.asList(DEFAULT_PARTS));
                  partAdapter = new ArrayAdapter<String>(this, R.layout.spinner_item, new ArrayList<String>(parts));
                  partAdapter.setDropDownViewResource(R.layout.spinner_item);
                  spPart.setAdapter(partAdapter);

                  findViewById(R.id.btnPick).setOnClickListener(v -> pickFile());
                  findViewById(R.id.btnAdb).setOnClickListener(v -> { log("> Executing: adb devices"); exec(L("adb","devices"), true, null); });
                  findViewById(R.id.btnFastboot).setOnClickListener(v -> { log("> Executing: fastboot devices"); exec(L("fastboot","devices"), true, null); });
                  findViewById(R.id.btnInfo).setOnClickListener(v -> readInfo());
                  findViewById(R.id.btnSearch).setOnClickListener(v -> searchOnline());
                  findViewById(R.id.btnParts).setOnClickListener(v -> readParts());
                  findViewById(R.id.btnFlashPart).setOnClickListener(v -> {
                      Object s = spPart.getSelectedItem();
                      if(s == null){ log("> Pilih partisi dulu"); return; }
                      confirmFlash(s.toString());
                  });
                  findViewById(R.id.btnFlashBoot).setOnClickListener(v -> confirmFlash("boot"));
                  findViewById(R.id.btnFlashRecovery).setOnClickListener(v -> confirmFlash("recovery"));
                  findViewById(R.id.btnFlashSystem).setOnClickListener(v -> confirmFlash("system"));
                  findViewById(R.id.btnFlashVbmeta).setOnClickListener(v -> flashVbmeta());
                  findViewById(R.id.btnUnlock).setOnClickListener(v -> confirm("Unlock Bootloader", "Unlock bootloader akan MENGHAPUS semua data di device. Lanjut?", () -> exec(L("fastboot","flashing","unlock"), true, null)));
                  findViewById(R.id.btnWipe).setOnClickListener(v -> confirm("Wipe Data", "Semua data user di device akan DIHAPUS. Lanjut?", () -> exec(L("fastboot","-w"), true, null)));
                  findViewById(R.id.btnBackup).setOnClickListener(v -> backupDialog());
                  findViewById(R.id.btnSideload).setOnClickListener(v -> sideload());
                  findViewById(R.id.btnReboot).setOnClickListener(v -> exec(L("adb","reboot"), true, null));
                  findViewById(R.id.btnRebootBL).setOnClickListener(v -> exec(L("adb","reboot","bootloader"), true, null));

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(usbReceiver, new IntentFilter(ACTION_USB), Context.RECEIVER_NOT_EXPORTED);
                      registerReceiver(usbReceiver, new IntentFilter(UsbManager.ACTION_USB_DEVICE_ATTACHED), Context.RECEIVER_EXPORTED);
                  } else {
                      registerReceiver(usbReceiver, new IntentFilter(ACTION_USB));
                      registerReceiver(usbReceiver, new IntentFilter(UsbManager.ACTION_USB_DEVICE_ATTACHED));
                  }
                  checkUsb();
              }
              @Override protected void onDestroy(){
                  super.onDestroy();
                  try { unregisterReceiver(usbReceiver); } catch(Exception e){}
              }

              // ---------- helpers ----------
              List<String> L(String... a){ return Arrays.asList(a); }
              void uiLog(final String s){ runOnUiThread(() -> log(s)); }
              void log(String s){
                  tvLog.append("\n"+s);
                  tvLog.post(() -> { if(tvLog.getLayout()!=null){ int amt = tvLog.getLayout().getLineTop(tvLog.getLineCount()) - tvLog.getHeight(); tvLog.scrollTo(0, Math.max(amt,0)); } });
              }
              void confirm(String title, String msg, final Runnable r){
                  new AlertDialog.Builder(this).setTitle(title).setMessage(msg)
                      .setPositiveButton("LANJUT", (d,w) -> r.run())
                      .setNegativeButton("Batal", null).show();
              }

              // ---------- USB ----------
              void checkUsb(){
                  HashMap<String, UsbDevice> list = usbManager.getDeviceList();
                  if(list.isEmpty()){ tvUsb.setText("USB: No OTG Device"); log("> USB: No device, colok kabel OTG bos!"); }
                  else { for(UsbDevice d: list.values()){ tvUsb.setText("USB: Found "+d.getDeviceName()+" VID:"+d.getVendorId()); log("> USB Device: "+d.getProductName()+" VID:"+d.getVendorId()+" PID:"+d.getProductId()); requestPerm(d); } }
              }
              void requestPerm(UsbDevice dev){
                  Intent in = new Intent(ACTION_USB);
                  in.setPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getBroadcast(this,0,in, PendingIntent.FLAG_MUTABLE);
                  usbManager.requestPermission(dev, pi);
              }
              BroadcastReceiver usbReceiver = new BroadcastReceiver(){
                  public void onReceive(Context c, Intent i){
                      if(ACTION_USB.equals(i.getAction())){
                          UsbDevice dev = i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          if(i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED,false) && dev != null){
                              tvUsb.setText("USB: Permission OK - "+dev.getDeviceName()); log("> USB Permission GRANTED!");
                          } else { tvUsb.setText("USB: Permission Denied"); log("> USB Permission DENIED!"); }
                      } else if(UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(i.getAction())){ checkUsb(); }
                  }
              };

              // ---------- command runner ----------
              void exec(final List<String> args, final boolean echo, final Done done){
                  new Thread(() -> {
                      final StringBuilder sb = new StringBuilder();
                      int code = -1;
                      try {
                          List<String> cmd = new ArrayList<>();
                          String tool = args.get(0);
                          if(tool.equals("adb")){
                              if(!new File(adbPath).exists()){
                                  runOnUiThread(() -> { log("> ERROR: libadb.so tidak ada di APK (download binary gagal)."); if(done!=null) done.run(127,""); });
                                  return;
                              }
                              cmd.add(adbPath);
                          } else if(tool.equals("fastboot")){
                              File fb = new File(getApplicationInfo().nativeLibraryDir, "libfastboot.so");
                              if(!fb.exists()){
                                  runOnUiThread(() -> { log("> ERROR: libfastboot.so tidak ada di APK. Fastboot belum didukung di build ini."); if(done!=null) done.run(127,""); });
                                  return;
                              }
                              cmd.add(fb.getAbsolutePath());
                          } else cmd.add(tool);
                          cmd.addAll(args.subList(1, args.size()));
                          if(echo) uiLog("> $ "+tool+" "+join(args.subList(1, args.size())));
                          ProcessBuilder pb = new ProcessBuilder(cmd);
                          pb.redirectErrorStream(true);
                          pb.environment().put("HOME", getFilesDir().getAbsolutePath());
                          pb.environment().put("TMPDIR", getCacheDir().getAbsolutePath());
                          java.lang.Process proc = pb.start();
                          BufferedReader br = new BufferedReader(new InputStreamReader(proc.getInputStream()));
                          String line;
                          while((line=br.readLine())!=null){
                              sb.append(line).append("\n");
                              if(echo){ final String l = line; runOnUiThread(() -> log(l)); }
                          }
                          code = proc.waitFor();
                      } catch(Exception e){
                          final String m = String.valueOf(e.getMessage());
                          runOnUiThread(() -> log("> EXCEPTION: "+m));
                      }
                      final int c = code;
                      final String o = sb.toString();
                      runOnUiThread(() -> {
                          if(echo) log("> Exit code: "+c);
                          if(done!=null) done.run(c, o);
                      });
                  }).start();
              }
              String join(List<String> l){
                  StringBuilder s = new StringBuilder();
                  for(String x: l){ if(s.length()>0) s.append(" "); s.append(x); }
                  return s.toString();
              }

              // ---------- device info ----------
              String prop(String all, String key){
                  Matcher m = Pattern.compile("\\["+Pattern.quote(key)+"\\]:\\s*\\[(.*?)\\]").matcher(all);
                  return m.find() ? m.group(1) : "";
              }
              void readInfo(){
                  log("> Membaca info device...");
                  exec(L("adb","shell","getprop"), false, (c,o) -> {
                      if(c != 0 || !o.contains("ro.product")){
                          log("> ADB gagal, coba fastboot...");
                          exec(L("fastboot","getvar","product"), false, (c2,o2) -> {
                              Matcher m = Pattern.compile("product:\\s*(\\S+)").matcher(o2);
                              if(m.find()){ etCode.setText(m.group(1)); log("> Codename (fastboot): "+m.group(1)); }
                              else log("> Gagal baca device. Isi codename manual di kolom atas.");
                          });
                          return;
                      }
                      String dev = prop(o,"ro.product.device");
                      String model = prop(o,"ro.product.model");
                      String brand = prop(o,"ro.product.manufacturer");
                      String ver = prop(o,"ro.build.version.release");
                      log("> Device: "+brand+" "+model+" ("+dev+") Android "+ver);
                      if(!dev.isEmpty()) etCode.setText(dev);
                  });
              }

              // ---------- partitions ----------
              void readParts(){ log("> Membaca partisi device..."); tryParts(0); }
              void tryParts(final int step){
                  List<String> cmd;
                  if(step==0) cmd = L("adb","shell","ls /dev/block/by-name 2>/dev/null || ls /dev/block/bootdevice/by-name");
                  else if(step==1) cmd = L("adb","shell","su -c 'ls /dev/block/by-name 2>/dev/null || ls /dev/block/bootdevice/by-name'");
                  else if(step==2) cmd = L("fastboot","getvar","all");
                  else {
                      setParts(new ArrayList<>(Arrays.asList(DEFAULT_PARTS)));
                      log("> Gagal baca otomatis, pakai daftar partisi umum.");
                      return;
                  }
                  exec(cmd, false, (c,o) -> {
                      ArrayList<String> r = parseParts(o, step==2);
                      if(!r.isEmpty()){
                          setParts(r);
                          log("> Ditemukan "+r.size()+" partisi ("+(step==0?"adb":step==1?"adb root":"fastboot")+")");
                      } else tryParts(step+1);
                  });
              }
              ArrayList<String> parseParts(String o, boolean fb){
                  LinkedHashSet<String> set = new LinkedHashSet<>();
                  if(fb){
                      Matcher m = Pattern.compile("partition-type:([A-Za-z0-9_\\-]+):").matcher(o);
                      while(m.find()) set.add(m.group(1));
                  } else {
                      for(String s: o.split("\n")){ s = s.trim(); if(s.matches("[A-Za-z0-9_.\\-]+")) set.add(s); }
                  }
                  return new ArrayList<>(set);
              }
              void setParts(ArrayList<String> r){
                  parts = new ArrayList<>(r);
                  partAdapter.clear();
                  partAdapter.addAll(r);
                  partAdapter.notifyDataSetChanged();
              }
              void guessPart(String name){
                  String n = name.toLowerCase(Locale.ROOT);
                  String g = "";
                  if(n.contains("vbmeta")) g = "vbmeta";
                  else if(n.contains("dtbo")) g = "dtbo";
                  else if(n.contains("twrp") || n.contains("recovery")) g = "recovery";
                  else if(n.contains("vendor_boot")) g = "vendor_boot";
                  else if(n.contains("init_boot")) g = "init_boot";
                  else if(n.contains("boot")) g = "boot";
                  else if(n.contains("system")) g = "system";
                  else if(n.contains("vendor")) g = "vendor";
                  else if(n.contains("super")) g = "super";
                  int idx = parts.indexOf(g);
                  if(!g.isEmpty() && idx >= 0){ spPart.setSelection(idx); log("> Saran partisi: "+g+" (cek lagi sebelum flash)"); }
              }

              // ---------- file pick ----------
              void pickFile(){
                  Intent intent = new Intent(Intent.ACTION_GET_CONTENT); intent.setType("*/*"); startActivityForResult(intent, 99);
              }
              @Override protected void onActivityResult(int req, int res, Intent data){
                  super.onActivityResult(req, res, data);
                  if(req==99 && res==RESULT_OK && data!=null){
                      final Uri uri = data.getData();
                      log("> Menyalin file...");
                      new Thread(() -> {
                          final String p = getRealPath(uri);
                          runOnUiThread(() -> { if(p==null) log("> Gagal salin file"); else setSelected(p); });
                      }).start();
                  }
              }
              String getRealPath(Uri uri){
                  try{
                      String name = "picked.img";
                      Cursor cur = getContentResolver().query(uri, null, null, null, null);
                      if(cur != null){
                          int ix = cur.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if(ix >= 0 && cur.moveToFirst()) name = cur.getString(ix);
                          cur.close();
                      }
                      name = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      InputStream is = getContentResolver().openInputStream(uri);
                      File out = new File(getCacheDir(), name);
                      FileOutputStream fos = new FileOutputStream(out);
                      byte[] buf = new byte[65536]; int len;
                      while((len=is.read(buf))>0) fos.write(buf,0,len);
                      fos.close(); is.close();
                      return out.getAbsolutePath();
                  } catch(Exception e){ return null; }
              }
              void setSelected(String path){
                  selectedPath = path;
                  File f = new File(path);
                  tvPath.setText("File: "+f.getName()+" ("+(f.length()/1048576)+" MB)");
                  log("> File dipilih: "+f.getName());
                  guessPart(f.getName());
              }

              // ---------- flash ----------
              void confirmFlash(final String part){

name: OTG FLASHER TERMINAL v2.0
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup SDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Build APP
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/otgflasher/pro
          echo "useANDROIDX=true" > gradle.properties
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } } include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          python3 app_builder.py
          pip install pillow -q
          python3 -c "from PIL import Image; [Image.new('RGBA',(s,s),(0,212,255,255)).save(f'app/src/main/res/{d}/ic_launcher.png') for s,d in [(192,'mipmap-xxxhdpi'),(144,'mipmap-xxhdpi'),(96,'mipmap-xhdpi'),(72,'mipmap-hdpi'),(48,'mipmap-mdpi')]]"
          wget -q https://github.com/tytydraco/adb/releases/download/1.0.0/adb-aarch64 -O app/src/main/jniLibs/arm64-v8a/libadb.so || mkdir -p app/src/main/jniLibs/arm64-v8a && touch app/src/main/jniLibs/arm64-v8a/libadb.so
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip; unzip -q gradle-8.5-bin.zip; ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5; chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OTG-Flasher-Terminal-v2
          path: app/build/outputs/apk/debug/*.apk

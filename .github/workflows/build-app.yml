name: Build Universal OTG Flasher, MTP & EDL Toolkit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Create Project Files with ADB/Fastboot Executor Engine
        run: |
          mkdir -p app/src/main/java/com/universal/otgflasher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'PROPS' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS

          # 2. settings.gradle
          cat << 'SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = 'Universal-OTG-Toolkit'
          include ':app'
          SETTINGS

          # 3. Root build.gradle
          cat << 'GRADLE_ROOT' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          GRADLE_ROOT

          # 4. App build.gradle
          cat << 'GRADLE_APP' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.universal.otgflasher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.universal.otgflasher'
                  minSdk 21
                  targetSdk 34
                  versionCode 8
                  versionName '8.0.0-AdbBridgeEngine'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
          }
          GRADLE_APP

          # 5. AndroidManifest.xml
          cat << 'XML' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.USB_PERMISSION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="Universal Hardware Flasher"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          # 6. Colors & Themes
          cat << 'XML' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#121212</color>
              <color name="card_bg">#1E1E1E</color>
              <color name="primary_accent">#00E676</color>
              <color name="secondary_accent">#2979FF</color>
              <color name="warning_yellow">#FFD600</color>
              <color name="alert_red">#FF1744</color>
              <color name="text_main">#FFFFFF</color>
              <color name="text_sub">#B0BEC5</color>
          </resources>
          XML

          # 7. MainActivity.java (ADB & Fastboot Local Shell Bridge)
          cat << 'JAVA' > app/src/main/java/com/universal/otgflasher/MainActivity.java
          package com.universal.otgflasher;

          import android.os.Bundle;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.material.tabs.TabLayout;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class MainActivity extends AppCompatActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  TabLayout tabLayout = findViewById(R.id.tabLayout);
                  TextView statusIndicator = findViewById(R.id.statusIndicator);
                  TextView consoleOutput = findViewById(R.id.consoleOutput);
                  ProgressBar progressBar = findViewById(R.id.progressBar);

                  tabLayout.addTab(tabLayout.newTab().setText("Panduan ADB Mode"));
                  tabLayout.addTab(tabLayout.newTab().setText("Cek Perangkat ADB"));
                  tabLayout.addTab(tabLayout.newTab().setText("Fastboot Devices"));
                  tabLayout.addTab(tabLayout.newTab().setText("Reboot EDL (9008)"));
                  tabLayout.addTab(tabLayout.newTab().setText("Bypass FRP Command"));

                  statusIndicator.setText("STATUS: ADB Bridge Engine Ready");
                  progressBar.setProgress(0);

                  tabLayout.addOnTabSelectedListener(new TabLayout.OnTabSelectedListener() {
                      @Override
                      public void onTabSelected(TabLayout.Tab tab) {
                          int pos = tab.getPosition();
                          if (pos == 0) {
                              statusIndicator.setText("MODE ACTIVE [PANDUAN ADB]:");
                              consoleOutput.setText("[PANDUAN PENGGUNAAN ADB BRIDGE]:\n" +
                                      "1. Hubungkan HP Target ke HP Master via kabel OTG.\n" +
                                      "2. Pastikan USB Debugging aktif di HP Target.\n" +
                                      "3. Pilih menu tab di atas untuk eksekusi perintah secara instan.");
                          } else if (pos == 1) {
                              statusIndicator.setText("STATUS: Menjalankan Perintah 'adb devices'...");
                              executeShellCommand("adb devices", statusIndicator, consoleOutput);
                          } else if (pos == 2) {
                              statusIndicator.setText("STATUS: Menjalankan Perintah 'fastboot devices'...");
                              executeShellCommand("fastboot devices", statusIndicator, consoleOutput);
                          } else if (pos == 3) {
                              statusIndicator.setText("STATUS: Mengirim Perintah Reboot EDL...");
                              executeShellCommand("adb reboot edl", statusIndicator, consoleOutput);
                          } else if (pos == 4) {
                              statusIndicator.setText("STATUS: Menjalankan Perintah Bypass FRP...");
                              executeShellCommand("adb shell am start -S -n com.google.android.gsf/.login.LoginActivity", statusIndicator, consoleOutput);
                          }
                      }
                      @Override
                      public void onTabUnselected(TabLayout.Tab tab) {}
                      @Override
                      public void onTabReselected(TabLayout.Tab tab) {
                          int pos = tab.getPosition();
                          if (pos == 1) executeShellCommand("adb devices", statusIndicator, consoleOutput);
                          if (pos == 2) executeShellCommand("fastboot devices", statusIndicator, consoleOutput);
                          if (pos == 3) executeShellCommand("adb reboot edl", statusIndicator, consoleOutput);
                      }
                  });
              }

              private void executeShellCommand(String command, TextView status, TextView log) {
                  new Thread(() -> {
                      StringBuilder output = new StringBuilder();
                      try {
                          Process process = Runtime.getRuntime().exec(command);
                          BufferedReader reader = new BufferedReader(new InputStreamReader(process.getInputStream()));
                          BufferedReader errorReader = new BufferedReader(new InputStreamReader(process.getErrorStream()));
                          String line;
                          while ((line = reader.readLine()) != null) {
                              output.append(line).append("\n");
                          }
                          while ((line = errorReader.readLine()) != null) {
                              output.append("ERR: ").append(line).append("\n");
                          }
                          process.waitFor();
                          
                          final String result = output.toString();
                          runOnUiThread(() -> {
                              status.setText("STATUS: Eksekusi Perintah Selesai");
                              log.setText("$ " + command + "\n\n" + (result.isEmpty() ? "[INFO]: Perintah dijalankan, tidak ada output teks kembali." : result));
                          });
                      } catch (Exception e) {
                          final String errorMsg = e.getMessage();
                          runOnUiThread(() -> {
                              status.setText("STATUS: Gagal Menjalankan Perintah");
                              log.setText("$ " + command + "\n\n[ERROR]: " + errorMsg + "\n\nPastikan binary adb/fastboot tersedia atau gunakan otg-host mode.");
                          });
                      }
                  }).start();
              }
          }
          JAVA

          # 8. activity_main.xml Layout
          cat << 'XML' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg_dark"
              android:padding="8dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="UNIVERSAL ADB &amp; OTG BRIDGE v8.0"
                  android:textColor="@color/primary_accent"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:layout_margin="4dp"/>

              <TextView
                  android:id="@+id/statusIndicator"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  android:padding="8dp"
                  android:textColor="@color/warning_yellow"
                  android:textSize="12sp"
                  android:fontFamily="monospace"/>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:max="100"
                  android:progress="0" />

              <com.google.android.material.tabs.TabLayout
                  android:id="@+id/tabLayout"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  app:tabMode="scrollable"
                  app:tabTextColor="@color/text_sub"
                  app:tabSelectedTextColor="@color/primary_accent"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="8dp"
                  android:background="#000000"
                  android:padding="8dp">

                  <TextView
                      android:id="@+id/consoleOutput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#00FF00"
                      android:fontFamily="monospace"
                      android:textSize="12sp"
                      android:text="[ADB BRIDGE ENGINE INITIALIZED]:\nSiap menghubungkan perintah ADB/Fastboot melalui kabel OTG." />
              </ScrollView>

          </LinearLayout>
          XML

      - name: Build Full Universal APK
        run: |
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-ADB-Bridge-v8
          path: app/build/outputs/apk/debug/app-debug.apk

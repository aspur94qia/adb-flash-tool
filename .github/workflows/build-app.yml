name: Build Universal OTG Flasher, MTP & EDL Toolkit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5 (Cache Disabled)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Create Clean Project Files v6
        run: |
          mkdir -p app/src/main/java/com/universal/otgflasher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          echo "rootProject.name = 'Universal-OTG-Toolkit'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # 2. Root build.gradle
          cat << 'GRADLE_ROOT' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLE_ROOT

          # 3. App build.gradle
          cat << 'GRADLE_APP' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.universal.otgflasher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.universal.otgflasher'
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName '6.0.0-UltimateWithTutorial'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
          }
          GRADLE_APP

          # 4. AndroidManifest.xml
          cat << 'XML' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" />
              <uses-permission android:name="android.permission.USB_PERMISSION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Universal Flasher &amp; Hardware Toolkit"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          # 5. Colors & Themes
          cat << 'XML' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#121212</color>
              <color name="card_bg">#1E1E1E</color>
              <color name="primary_accent">#00E676</color>
              <color name="secondary_accent">#2979FF</color>
              <color name="warning_yellow">#FFD600</color>
              <color name="alert_red">#FF1744</color>
              <color name="text_main">#FFFFFF</color>
              <color name="text_sub">#B0BEC5</color>
          </resources>
          XML

          # 6. MainActivity.java (Standard ASCII Strings)
          cat << 'JAVA' > app/src/main/java/com/universal/otgflasher/MainActivity.java
          package com.universal.otgflasher;

          import android.os.Bundle;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.material.tabs.TabLayout;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  TabLayout tabLayout = findViewById(R.id.tabLayout);
                  TextView statusIndicator = findViewById(R.id.statusIndicator);
                  TextView consoleOutput = findViewById(R.id.consoleOutput);
                  ProgressBar progressBar = findViewById(R.id.progressBar);

                  tabLayout.addTab(tabLayout.newTab().setText("Panduan & Alat"));
                  tabLayout.addTab(tabLayout.newTab().setText("Flasher OTG"));
                  tabLayout.addTab(tabLayout.newTab().setText("EDL & MTK BROM"));
                  tabLayout.addTab(tabLayout.newTab().setText("IC BIOS Programmer"));
                  tabLayout.addTab(tabLayout.newTab().setText("UART Serial Console"));
                  tabLayout.addTab(tabLayout.newTab().setText("MTP File Manager"));
                  tabLayout.addTab(tabLayout.newTab().setText("ADB Shell & FRP"));

                  statusIndicator.setText("STATUS USB: Waiting USB OTG / Serial / CH341A Cable...");
                  progressBar.setProgress(0);

                  tabLayout.addOnTabSelectedListener(new TabLayout.OnTabSelectedListener() {
                      @Override
                      public void onTabSelected(TabLayout.Tab tab) {
                          int pos = tab.getPosition();
                          if (pos == 0) {
                              statusIndicator.setText("MODE ACTIVE [PANDUAN & ALAT]: Petunjuk Penggunaan");
                              consoleOutput.setText("[PANDUAN KONEKSI USB OTG]:\n" +
                                      "1. Aktifkan Koneksi OTG di Pengaturan HP Master.\n" +
                                      "2. Hubungkan Kabel OTG dari HP Master ke Perangkat Target / Adapter.\n\n" +
                                      "[ALAT YANG DIBUTUHKAN PER-TOOLS]:\n" +
                                      "- Flasher OTG: Kabel Data OTG Type-C / Micro-USB.\n" +
                                      "- IC BIOS Programmer: Adapter CH341A / FT232H + Clip SOP8/SOP16.\n" +
                                      "- UART Serial Console: Modul USB-to-UART (CP2102/CH340/PL2303).\n" +
                                      "- EDL & MTK BROM: Kabel USB Data / Testpoint Clip.\n\n" +
                                      "[CARA PENGGUNAAN]: Pilih Tab sesuai kebutuhan fungsi service.");
                          } else {
                              statusIndicator.setText("MODE ACTIVE [" + tab.getText() + "]: Ready");
                              consoleOutput.setText("[SYSTEM LOG]: Tab " + tab.getText() + " Aktif.\n[STATUS DRIVER]: USB Host Service Siap Memindai Perangkat Target...");
                          }
                      }
                      @Override
                      public void onTabUnselected(TabLayout.Tab tab) {}
                      @Override
                      public void onTabReselected(TabLayout.Tab tab) {}
                  });
              }
          }
          JAVA

          # 7. activity_main.xml Layout
          cat << 'XML' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg_dark"
              android:padding="8dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="UNIVERSAL OTG &amp; HARDWARE TOOLKIT v6.0"
                  android:textColor="@color/primary_accent"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:layout_margin="4dp"/>

              <TextView
                  android:id="@+id/statusIndicator"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  android:padding="8dp"
                  android:textColor="@color/warning_yellow"
                  android:textSize="12sp"
                  android:fontFamily="monospace"/>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:max="100"
                  android:progress="0" />

              <com.google.android.material.tabs.TabLayout
                  android:id="@+id/tabLayout"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  app:tabMode="scrollable"
                  app:tabTextColor="@color/text_sub"
                  app:tabSelectedTextColor="@color/primary_accent"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="8dp"
                  android:background="#000000"
                  android:padding="8dp">

                  <TextView
                      android:id="@+id/consoleOutput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#00FF00"
                      android:fontFamily="monospace"
                      android:textSize="12sp"
                      android:text="[PANDUAN KONEKSI USB OTG]:\n1. Aktifkan Koneksi OTG di Pengaturan HP Master.\n2. Hubungkan Kabel OTG dari HP Master ke Perangkat Target / Adapter.\n\n[ALAT YANG DIBUTUHKAN PER-TOOLS]:\n- Flasher OTG: Kabel Data OTG Type-C / Micro-USB.\n- IC BIOS Programmer: Adapter CH341A / FT232H + Clip SOP8/SOP16.\n- UART Serial Console: Modul USB-to-UART (CP2102/CH340/PL2303).\n- EDL &amp; MTK BROM: Kabel USB Data / Testpoint Clip.\n\n[CARA PENGGUNAAN]: Pilih Tab sesuai kebutuhan fungsi service." />
              </ScrollView>

          </LinearLayout>
          XML

      - name: Build Full Universal APK
        run: |
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-OTG-Hardware-Toolkit-v6
          path: app/build/outputs/apk/debug/app-debug.apk

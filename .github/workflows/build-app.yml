name: Build Universal OTG Flasher, MTP & EDL Toolkit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Create Master Ultimate Project Files
        run: |
          mkdir -p app/src/main/java/com/universal/otgflasher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. gradle.properties
          cat << 'PROPS' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS

          # 2. settings.gradle
          cat << 'SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = 'Universal-OTG-Toolkit'
          include ':app'
          SETTINGS

          # 3. Root build.gradle
          cat << 'GRADLE_ROOT' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          GRADLE_ROOT

          # 4. App build.gradle
          cat << 'GRADLE_APP' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.universal.otgflasher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.universal.otgflasher'
                  minSdk 21
                  targetSdk 34
                  versionCode 9
                  versionName '9.0.0-MasterUltimate'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
          }
          GRADLE_APP

          # 5. Device Filter XML
          cat << 'XML' > app/src/main/res/xml/device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="6790" />
              <usb-device vendor-id="1027" />
              <usb-device vendor-id="4292" />
              <usb-device vendor-id="1659" />
          </resources>
          XML

          # 6. AndroidManifest.xml
          cat << 'XML' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.USB_PERMISSION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="Universal Hardware Toolkit"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          XML

          # 7. Colors & Themes
          cat << 'XML' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#121212</color>
              <color name="card_bg">#1E1E1E</color>
              <color name="primary_accent">#00E676</color>
              <color name="secondary_accent">#2979FF</color>
              <color name="warning_yellow">#FFD600</color>
              <color name="alert_red">#FF1744</color>
              <color name="text_main">#FFFFFF</color>
              <color name="text_sub">#B0BEC5</color>
          </resources>
          XML

          # 8. MainActivity.java (Full Master Code dengan Semua Tab, Tutorial, & USB Hardware/ADB Engine)
          cat << 'JAVA' > app/src/main/java/com/universal/otgflasher/MainActivity.java
          package com.universal.otgflasher;

          import android.content.Context;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbManager;
          import android.os.Bundle;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.material.tabs.TabLayout;
          import com.hoho.android.usbserial.driver.UsbSerialDriver;
          import com.hoho.android.usbserial.driver.UsbSerialProber;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private UsbManager usbManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);

                  TabLayout tabLayout = findViewById(R.id.tabLayout);
                  TextView statusIndicator = findViewById(R.id.statusIndicator);
                  TextView consoleOutput = findViewById(R.id.consoleOutput);
                  ProgressBar progressBar = findViewById(R.id.progressBar);

                  tabLayout.addTab(tabLayout.newTab().setText("Panduan & Alat"));
                  tabLayout.addTab(tabLayout.newTab().setText("Scan USB Serial"));
                  tabLayout.addTab(tabLayout.newTab().setText("IC BIOS Programmer"));
                  tabLayout.addTab(tabLayout.newTab().setText("UART Console"));
                  tabLayout.addTab(tabLayout.newTab().setText("Flasher OTG"));
                  tabLayout.addTab(tabLayout.newTab().setText("EDL & MTK BROM"));
                  tabLayout.addTab(tabLayout.newTab().setText("ADB & FRP Bridge"));

                  statusIndicator.setText("STATUS: Master Toolkit v9.0 Ready");
                  progressBar.setProgress(0);

                  tabLayout.addOnTabSelectedListener(new TabLayout.OnTabSelectedListener() {
                      @Override
                      public void onTabSelected(TabLayout.Tab tab) {
                          int pos = tab.getPosition();
                          if (pos == 0) {
                              statusIndicator.setText("MODE ACTIVE [PANDUAN & ALAT PENDUKUNG]:");
                              consoleOutput.setText("[PANDUAN KONEKSI & ALAT YANG DIBUTUHKAN]:\n\n" +
                                      "1. PANDUAN KONEKSI OTG:\n" +
                                      "   - Aktifkan menu 'OTG Connection' di Pengaturan HP Master.\n" +
                                      "   - Colokkan Kabel OTG (Type-C / Micro-USB) ke HP Master.\n\n" +
                                      "2. ALAT PENDUKUNG PER-TOOLS:\n" +
                                      "   - Flasher OTG & EDL: Kabel Data USB / Testpoint Pinset.\n" +
                                      "   - IC BIOS Programmer: Adapter CH341A / FT232H + Clip SOP8 / SOP16.\n" +
                                      "   - UART Serial Console: Modul USB-to-UART (CP2102 / CH340 / PL2303).\n" +
                                      "   - ADB Shell & FRP: Kabel OTG + HP Target yang aktif USB Debugging.\n\n" +
                                      "[CARA PAKAI]: Pilih tab di atas sesuai fungsi service yang diinginkan.");
                          } else if (pos == 1) {
                              scanUsbHardware(statusIndicator, consoleOutput);
                          } else if (pos == 2) {
                              statusIndicator.setText("MODE ACTIVE [IC BIOS PROGRAMMER]: CH341A / FT232H Ready");
                              consoleOutput.setText("[IC BIOS PROGRAMMER GUIDE]:\n" +
                                      "1. Hubungkan adapter CH341A ke port OTG HP Master.\n" +
                                      "2. Pasang Clip SOP8 pada IC BIOS (Winbond/Macronix) di motherboard target.\n" +
                                      "3. Pastikan tegangan jumper 3.3V terpilih dengan benar di adapter CH341A.");
                          } else if (pos == 3) {
                              statusIndicator.setText("MODE ACTIVE [UART SERIAL CONSOLE]: Router & STB Debugger");
                              consoleOutput.setText("[UART SERIAL CONSOLE GUIDE]:\n" +
                                      "1. Hubungkan modul USB-to-UART (CP2102/CH340) ke OTG.\n" +
                                      "2. Hubungkan pin TX ke RX target, RX ke TX target, dan GND ke GND.\n" +
                                      "3. Baud Rate Standar: 115200 (Router OpenWrt / Set-Top Box).");
                          } else if (pos == 4) {
                              statusIndicator.setText("MODE ACTIVE [FLASHER OTG]: Fastboot A/B & Dynamic Partitions");
                              consoleOutput.setText("[FLASHER OTG GUIDE]:\n" +
                                      "1. Masukkan HP target ke mode Fastboot.\n" +
                                      "2. Colokkan kabel data USB dari HP Master ke HP Target via OTG.\n" +
                                      "3. Eksekusi perintah flash file .img secara aman.");
                          } else if (pos == 5) {
                              statusIndicator.setText("MODE ACTIVE [EDL & MTK BROM]: Qualcomm 9008 & MTK Service");
                              consoleOutput.setText("[EDL & MTK BROM GUIDE]:\n" +
                                      "1. Qualcomm: Masuk mode EDL 9008 (Testpoint atau kabel EDL).\n" +
                                      "2. MediaTek: Hubungkan HP dengan tombol volume tahan untuk BROM mode.");
                          } else if (pos == 6) {
                              statusIndicator.setText("STATUS: Menjalankan Perintah 'adb devices'...");
                              executeShellCommand("adb devices", statusIndicator, consoleOutput);
                          }
                      }
                      @Override
                      public void onTabUnselected(TabLayout.Tab tab) {}
                      @Override
                      public void onTabReselected(TabLayout.Tab tab) {
                          if (tab.getPosition() == 1) scanUsbHardware(statusIndicator, consoleOutput);
                          if (tab.getPosition() == 6) executeShellCommand("adb devices", statusIndicator, consoleOutput);
                      }
                  });
              }

              private void scanUsbHardware(TextView status, TextView log) {
                  List<UsbSerialDriver> availableDrivers = UsbSerialProber.getDefaultProber().findAllDrivers(usbManager);
                  if (availableDrivers.isEmpty()) {
                      status.setText("STATUS USB: Tidak ada Hardware USB Serial terdeteksi.");
                      log.setText("[SCAN HARDWARE USB]: Tidak ada perangkat USB Host / CH341A terhubung.\n\n" +
                              "Silakan colokkan adapter hardware (CH341A, CP2102, FT232H) melalui kabel OTG ke HP ini.");
                  } else {
                      UsbSerialDriver driver = availableDrivers.get(0);
                      UsbDevice device = driver.getDevice();
                      status.setText("TERDETEKSI: " + device.getProductName() + " [VID:" + String.format("%04X", device.getVendorId()) + "]");
                      log.setText("[HARDWARE DETECTED SUCCESS!]\n" +
                              "• Product Name: " + device.getProductName() + "\n" +
                              "• Vendor ID: 0x" + String.format("%04X", device.getVendorId()) + "\n" +
                              "• Product ID: 0x" + String.format("%04X", device.getProductId()) + "\n" +
                              "• Driver Class: " + driver.getClass().getSimpleName() + "\n\n" +
                              "[STATUS]: Jalur komunikasi USB Serial siap digunakan!");
                  }
              }

              private void executeShellCommand(String command, TextView status, TextView log) {
                  new Thread(() -> {
                      StringBuilder output = new StringBuilder();
                      try {
                          Process process = Runtime.getRuntime().exec(command);
                          BufferedReader reader = new BufferedReader(new InputStreamReader(process.getInputStream()));
                          String line;
                          while ((line = reader.readLine()) != null) {
                              output.append(line).append("\n");
                          }
                          process.waitFor();
                          final String result = output.toString();
                          runOnUiThread(() -> {
                              status.setText("STATUS: Perintah ADB Selesai");
                              log.setText("$ " + command + "\n\n" + (result.isEmpty() ? "[INFO]: Tidak ada perangkat terdeteksi atau USB Debugging belum aktif." : result));
                          });
                      } catch (Exception e) {
                          final String errorMsg = e.getMessage();
                          runOnUiThread(() -> {
                              status.setText("STATUS: Gagal Eksekusi");
                              log.setText("$ " + command + "\n\n[ERROR]: " + errorMsg);
                          });
                      }
                  }).start();
              }
          }
          JAVA

          # 9. activity_main.xml Layout
          cat << 'XML' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg_dark"
              android:padding="8dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="UNIVERSAL HARDWARE TOOLKIT v9.0 MASTER"
                  android:textColor="@color/primary_accent"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:layout_margin="4dp"/>

              <TextView
                  android:id="@+id/statusIndicator"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  android:padding="8dp"
                  android:textColor="@color/warning_yellow"
                  android:textSize="12sp"
                  android:fontFamily="monospace"/>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:max="100"
                  android:progress="0" />

              <com.google.android.material.tabs.TabLayout
                  android:id="@+id/tabLayout"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  app:tabMode="scrollable"
                  app:tabTextColor="@color/text_sub"
                  app:tabSelectedTextColor="@color/primary_accent"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="8dp"
                  android:background="#000000"
                  android:padding="8dp">

                  <TextView
                      android:id="@+id/consoleOutput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#00FF00"
                      android:fontFamily="monospace"
                      android:textSize="12sp"
                      android:text="[MASTER TOOLKIT v9.0 INITIALIZED]:\nSeluruh modul panduan, alat pendukung, USB Serial Driver, dan ADB Bridge siap digunakan." />
              </ScrollView>

          </LinearLayout>
          XML

      - name: Build Full Universal APK
        run: |
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Hardware-Toolkit-v9-Master
          path: app/build/outputs/apk/debug/app-debug.apk

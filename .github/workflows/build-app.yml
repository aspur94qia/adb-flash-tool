name: Build Universal OTG Flasher, MTP & EDL Toolkit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Create Complete Project Files with Real USB Serial Drivers
        run: |
          mkdir -p app/src/main/java/com/universal/otgflasher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. gradle.properties
          cat << 'PROPS' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS

          # 2. settings.gradle (Menambahkan JitPack Repository untuk usb-serial-for-android)
          cat << 'SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = 'Universal-OTG-Toolkit'
          include ':app'
          SETTINGS

          # 3. Root build.gradle
          cat << 'GRADLE_ROOT' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          GRADLE_ROOT

          # 4. App build.gradle (Import Library USB Serial Asli)
          cat << 'GRADLE_APP' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.universal.otgflasher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.universal.otgflasher'
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName '7.0.0-RealDriverEngine'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              
              // Library Driver Hardware USB Native untuk CH341A, FT232H, CP2102, CH340, PL2303
              implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
          }
          GRADLE_APP

          # 5. Config USB Device Filter (device_filter.xml)
          cat << 'XML' > app/src/main/res/xml/device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- CH341A / CH340 Series (Vendor ID: 0x1a86) -->
              <usb-device vendor-id="6790" />
              <!-- FT232H / FTDI Series (Vendor ID: 0x0403) -->
              <usb-device vendor-id="1027" />
              <!-- CP2102 Silicon Labs (Vendor ID: 0x10c4) -->
              <usb-device vendor-id="4292" />
              <!-- PL2303 Prolific (Vendor ID: 0x067b) -->
              <usb-device vendor-id="1659" />
          </resources>
          XML

          # 6. AndroidManifest.xml (Mendaftarkan USB Intent Filter)
          cat << 'XML' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.USB_PERMISSION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="Universal Hardware Flasher"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          XML

          # 7. Colors & Themes
          cat << 'XML' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#121212</color>
              <color name="card_bg">#1E1E1E</color>
              <color name="primary_accent">#00E676</color>
              <color name="secondary_accent">#2979FF</color>
              <color name="warning_yellow">#FFD600</color>
              <color name="alert_red">#FF1744</color>
              <color name="text_main">#FFFFFF</color>
              <color name="text_sub">#B0BEC5</color>
          </resources>
          XML

          # 8. MainActivity.java (Engine Deteksi Hardware USB Host Real)
          cat << 'JAVA' > app/src/main/java/com/universal/otgflasher/MainActivity.java
          package com.universal.otgflasher;

          import android.content.Context;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbManager;
          import android.os.Bundle;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.material.tabs.TabLayout;
          import com.hoho.android.usbserial.driver.UsbSerialDriver;
          import com.hoho.android.usbserial.driver.UsbSerialProber;

          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private UsbManager usbManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);

                  TabLayout tabLayout = findViewById(R.id.tabLayout);
                  TextView statusIndicator = findViewById(R.id.statusIndicator);
                  TextView consoleOutput = findViewById(R.id.consoleOutput);
                  ProgressBar progressBar = findViewById(R.id.progressBar);

                  tabLayout.addTab(tabLayout.newTab().setText("Panduan & Alat"));
                  tabLayout.addTab(tabLayout.newTab().setText("Scan Hardware USB"));
                  tabLayout.addTab(tabLayout.newTab().setText("IC BIOS Programmer"));
                  tabLayout.addTab(tabLayout.newTab().setText("UART Serial Console"));
                  tabLayout.addTab(tabLayout.newTab().setText("Flasher OTG"));
                  tabLayout.addTab(tabLayout.newTab().setText("EDL & MTK BROM"));
                  tabLayout.addTab(tabLayout.newTab().setText("ADB Shell & FRP"));

                  statusIndicator.setText("STATUS USB: Initializing USB Host Driver...");
                  progressBar.setProgress(0);

                  tabLayout.addOnTabSelectedListener(new TabLayout.OnTabSelectedListener() {
                      @Override
                      public void onTabSelected(TabLayout.Tab tab) {
                          int pos = tab.getPosition();
                          if (pos == 1) {
                              // Scan Hardware USB OTG Beneran
                              scanUsbHardware(statusIndicator, consoleOutput);
                          } else if (pos == 0) {
                              statusIndicator.setText("MODE ACTIVE [PANDUAN & ALAT]: Petunjuk Penggunaan");
                              consoleOutput.setText("[PANDUAN KONEKSI HARDWARE USB]:\n" +
                                      "1. Colokkan OTG + Adapter CH341A / CP2102 / Kabel Data ke HP Master.\n" +
                                      "2. Pilih Tab 'Scan Hardware USB' untuk tes deteksi Chipset asli.\n" +
                                      "3. Driver usb-serial-for-android v3.8.0 Aktif.");
                          } else {
                              statusIndicator.setText("MODE ACTIVE [" + tab.getText() + "]: Driver Ready");
                              consoleOutput.setText("[SYSTEM LOG]: Mode " + tab.getText() + " Siap Mengirim Data Biner.");
                          }
                      }
                      @Override
                      public void onTabUnselected(TabLayout.Tab tab) {}
                      @Override
                      public void onTabReselected(TabLayout.Tab tab) {
                          if (tab.getPosition() == 1) {
                              scanUsbHardware(statusIndicator, consoleOutput);
                          }
                      }
                  });
              }

              private void scanUsbHardware(TextView status, TextView log) {
                  List<UsbSerialDriver> availableDrivers = UsbSerialProber.getDefaultProber().findAllDrivers(usbManager);
                  if (availableDrivers.isEmpty()) {
                      status.setText("STATUS USB: Tidak ada Hardware USB Serial / CH341A terdeteksi.");
                      log.setText("[SCAN HARDWARE USB]: Tidak ada perangkat USB Host terhubung.\n\n" +
                              "Silakan colokkan adapter USB (CH341A, CP2102, FT232H, atau HP Target EDL/ADB) melalui kabel OTG ke HP ini.");
                  } else {
                      UsbSerialDriver driver = availableDrivers.get(0);
                      UsbDevice device = driver.getDevice();
                      status.setText("HARDWARE TERDETEKSI: " + device.getProductName() + " [VID:" + String.format("%04X", device.getVendorId()) + "]");
                      log.setText("[HARDWARE DETECTED SUCCESS!]\n" +
                              "• Device Name: " + device.getDeviceName() + "\n" +
                              "• Product Name: " + device.getProductName() + "\n" +
                              "• Vendor ID: 0x" + String.format("%04X", device.getVendorId()) + "\n" +
                              "• Product ID: 0x" + String.format("%04X", device.getProductId()) + "\n" +
                              "• Driver Class: " + driver.getClass().getSimpleName() + "\n\n" +
                              "[STATUS]: Port Serial Hardware Siap Diumpan Data Biner!");
                  }
              }
          }
          JAVA

          # 9. activity_main.xml Layout
          cat << 'XML' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg_dark"
              android:padding="8dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="UNIVERSAL OTG HARDWARE TOOLKIT v7.0"
                  android:textColor="@color/primary_accent"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:layout_margin="4dp"/>

              <TextView
                  android:id="@+id/statusIndicator"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  android:padding="8dp"
                  android:textColor="@color/warning_yellow"
                  android:textSize="12sp"
                  android:fontFamily="monospace"/>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:max="100"
                  android:progress="0" />

              <com.google.android.material.tabs.TabLayout
                  android:id="@+id/tabLayout"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card_bg"
                  app:tabMode="scrollable"
                  app:tabTextColor="@color/text_sub"
                  app:tabSelectedTextColor="@color/primary_accent"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="8dp"
                  android:background="#000000"
                  android:padding="8dp">

                  <TextView
                      android:id="@+id/consoleOutput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#00FF00"
                      android:fontFamily="monospace"
                      android:textSize="12sp"
                      android:text="[USB HARDWARE ENGINE INITIALIZED]:\nDriver Native usb-serial-for-android Siap Membaca Chipset Hardware CH341A / FT232H / CP2102 / CH340 / PL2303." />
              </ScrollView>

          </LinearLayout>
          XML

      - name: Build Full Universal APK
        run: |
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-OTG-RealDriver-v7
          path: app/build/outputs/apk/debug/app-debug.apk
